[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flake8-deprecated"
version = "2.4.1.dev0"
authors = [
  { name="Gil Forcada Codinachs", email="gil.gnome@gmail.com" },
]
description = "Warns about deprecated method calls"
keywords = ["pep8", "flake8", "python", ]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Environment :: Console",
        "Framework :: Flake8",
        'Framework :: Plone',
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Programming Language :: Python :: Implementation :: CPython",
        "Programming Language :: Python :: Implementation :: PyPy",
        "Topic :: Software Development",
        "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["flake8"]

[project.urls]
"Homepage" = "https://github.com/gforcada/flake8-deprecated"
"Bug Tracker" = "https://github.com/gforcada/flake8-deprecated/issues"
"Changelog" = "https://github.com/gforcada/flake8-deprecated/blob/main/CHANGES.md"

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."flake8.extension"]
D001 = "flake8_deprecated:Flake8Deprecated"

[tool.isort]
profile = "plone"

[tool.black]
target-version = ["py312"]
skip-string-normalization = true

[tool.check-manifest]
ignore = [
    ".vscode/*",
    "venv/*",
]
